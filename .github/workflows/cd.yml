# CD: after CI passes on main -> migrate Neon -> deploy that exact image -> smoke test.
# Rollback: Actions -> CD -> Run workflow -> paste an older commit SHA.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (rollback). Migrations are skipped."
        required: true

permissions:
  contents: read

concurrency:
  # never two deploys at once; queue instead of cancelling
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.LIVE_URL }}
    env:
      SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}
