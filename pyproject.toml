[project]
name = "kubeguide"
version = "0.1.0"
description = "A Kubernetes assistant for on-call engineers that explains errors, objects and kubectl output from the official docs for the cluster's version."
readme = "README.md"
authors = [
    { name = "Shivani Stalin", email = "shivanistalin2006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
